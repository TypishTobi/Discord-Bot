name: Mitgliederliste aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub startet oft etwas verspätet)
  workflow_dispatch:          # manuell über den Actions-Tab
  push:
    branches: [main]          # nach Änderungen an der Website sofort neu veröffentlichen

permissions:
  contents: write   # für den Keepalive-Commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Aktuell veröffentlichte Liste laden
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/members.json" -o /tmp/live.json || rm -f /tmp/live.json

      - name: Mitglieder von Discord abrufen
        id: fetch
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ vars.GUILD_ID }}
          ROLE_IDS: ${{ vars.ROLE_IDS }}
        run: python3 scripts/fetch_members.py site/members.json --previous /tmp/live.json

      # Geplante Läufe veröffentlichen nur, wenn sich die Liste geändert hat
      - if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4

      # GitHub deaktiviert Zeitpläne nach 60 Tagen ohne Repo-Aktivität.
      # Ein leerer Commit nach 50 Tagen Ruhe verhindert das.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive für geplante Workflows"
            git push
          fi
