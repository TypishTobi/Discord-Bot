name: Regelwerk mit Button posten

# Manuell starten: postet Regelwerk (rules/regelwerk.md) + Button in den Kanal.
# Mit Nachricht-ID wird die bestehende Nachricht aktualisiert (z. B. nach Regeländerungen).
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Kanal-ID (z. B. #regelwerk)"
        required: true
      message_id:
        description: "Optional: ID der bestehenden Bot-Nachricht, die aktualisiert werden soll"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Button posten
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CODEWORD: ${{ vars.CODEWORD }}
        run: python3 scripts/post_button.py "$CHANNEL_ID" "$MESSAGE_ID"
