<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unser Team</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1e1f22;
      --muted: #6b6f76;
      --border: #e3e5e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1f22;
        --card: #2b2d31;
        --text: #f2f3f5;
        --muted: #a3a6aa;
        --border: #3a3c42;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    h2 {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin: 32px 0 12px;
    }
    h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .member {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .member img { width: 44px; height: 44px; border-radius: 6px; flex-shrink: 0; image-rendering: pixelated; }
    .member .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member .user { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member > div { min-width: 0; }
    .empty, .error { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Unser Team</h1>
    <div class="meta" id="meta">Lade Mitglieder …</div>
    <div id="roles"></div>
  </main>

  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // Minecraft-Kopf (mit Hut-Ebene) über die UUID; ohne eingetragenen Namen der Standard-Steve-Kopf
    const head = m => `https://minotar.net/helm/${encodeURIComponent(m.minecraftUuid || "MHF_Steve")}/88.png`;

    // Live vom Cloudflare Worker; falls der nicht erreichbar ist, die von GitHub erzeugte Kopie
    const LIVE_URL = "https://mc-namen.typischtobi66.workers.dev/members.json";
    const load = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

    load(LIVE_URL)
      .catch(() => load("members.json"))
      .then(data => {
        document.getElementById("title").textContent = data.guild;
        const total = new Set(data.roles.flatMap(r => r.members.map(m => m.id))).size;
        const updated = data.updatedAt ? new Date(data.updatedAt).toLocaleString("de-DE") : "–";
        document.getElementById("meta").textContent = `${total} Mitglieder · Stand: ${updated}`;

        // Nach dem Rang vor dem "|" gruppieren ("Admin | Mrtx" -> Gruppe "Admin", Name "Mrtx").
        // Die Daten kommen schon sortiert (höchster Rang zuerst), daher reicht die Reihenfolge.
        const groups = new Map();
        const seen = new Set();
        for (const role of data.roles) {
          for (const m of role.members) {
            if (seen.has(m.id)) continue;
            seen.add(m.id);
            const rank = m.rank || "Weitere";
            if (!groups.has(rank)) groups.set(rank, { color: m.rankColor || role.color, members: [] });
            groups.get(rank).members.push(m);
          }
        }

        document.getElementById("roles").innerHTML = groups.size ? [...groups].map(([rank, group]) => `
          <section>
            <h2><span class="dot" style="${group.color ? `background:${esc(group.color)}` : ""}"></span>
              ${esc(rank)} — ${group.members.length}</h2>
            <div class="grid">${group.members.map(m => `
              <div class="member">
                <img src="${esc(head(m))}" alt="">
                <div>
                  <div class="name" ${group.color ? `style="color:${esc(group.color)}"` : ""}>${esc(m.name || m.displayName)}</div>
                  ${m.minecraft ? `<div class="user">@${esc(m.minecraft)}</div>` : ""}
                </div>
              </div>`).join("")}</div>
          </section>`).join("") : `<p class="empty">Noch keine Mitglieder.</p>`;
      })
      .catch(() => {
        document.getElementById("meta").innerHTML = '<span class="error">Mitgliederliste konnte nicht geladen werden.</span>';
      });
  </script>
</body>
</html>
